name: Build, Test, and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_HOOK }}
  RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_HOOK }}

jobs:

  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
        run: mvn test -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  build-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend (skip tests - already ran)
        run: mvn clean package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar


  build-frontend:
    needs: test-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./library-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './library-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://library-api.onrender.com

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: library-frontend/dist/


  deploy-backend:
    needs: build-backend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deploy
        run: |
          echo "Deploying backend to Render..."
          curl -X POST "${{ env.RENDER_BACKEND_HOOK }}"

      - name: Wait for deployment
        run: sleep 120

      - name: Health check backend
        run: |
          echo "Checking backend health..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://library-api.onrender.com/actuator/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo " Backend is healthy (status: $STATUS)"
              exit 0
            fi
            echo "Attempt $i/12: status=$STATUS, waiting 15s..."
            sleep 15
          done
          echo " Backend health check failed"
          exit 1


  deploy-frontend:
    needs: build-frontend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render frontend deploy
        run: |
          echo "Deploying frontend to Render..."
          curl -X POST "${{ env.RENDER_FRONTEND_HOOK }}"

      - name: Wait for deployment
        run: sleep 90

      - name: Health check frontend
        run: |
          echo "Checking frontend health..."
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://library-frontend.onrender.com || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo " Frontend is healthy (status: $STATUS)"
              exit 0
            fi
            echo "Attempt $i/6: status=$STATUS, waiting 15s..."
            sleep 15
          done
          echo " Frontend health check failed"
          exit 1

  report-status:
    needs: [deploy-backend, deploy-frontend]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "🚀 Deployment completed!"
          echo "Backend:  https://library-api.onrender.com"
          echo "Frontend: https://library-frontend.onrender.com"
          echo "=============================================="