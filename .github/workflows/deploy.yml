name: Build, Test, and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_HOOK }}
  RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_HOOK }}

jobs:

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn clean package -DskipTests -B

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./library-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './library-frontend/package-lock.json'
      - run: npm ci
      - run: npm run build

  test-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test


  deploy:
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ env.RENDER_BACKEND_HOOK }}"
          echo " Backend deploy triggered"
          curl -X POST "${{ env.RENDER_FRONTEND_HOOK }}"
          echo " Frontend deploy triggered"


  healthcheck:
    needs: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Health check backend
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://library-api.onrender.com/actuator/health || echo "000")
            echo "Backend attempt $i/15: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo " Backend healthy!" && exit 0
            sleep 15
          done
          echo " Backend health check failed"
          exit 1

      - name: Health check frontend
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://library-frontend.onrender.com || echo "000")
            echo "Frontend attempt $i/10: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo " Frontend healthy!" && exit 0
            sleep 15
          done
          echo " Frontend health check failed"
          exit 1